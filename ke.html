<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识速通 — AI 文档学习路径生成器</title>
<style>
:root{--bg:#09090b;--surface:#18181d;--card:#1e1e26;--border:#2a2a3a;--border-hover:#3d3d52;--text:#e8e8f0;--text-dim:#a0a0b8;--muted:#606078;--purple:#6366f1;--purple-hover:#818cf8;--purple-glow:rgba(99,102,241,0.2);--purple-soft:rgba(99,102,241,0.08);--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--cyan:#06b6d4;--radius:10px;--radius-sm:7px;--radius-xs:5px;--transition:180ms cubic-bezier(0.4,0,0.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-glow::before,.bg-glow::after{content:'';position:absolute;border-radius:50%;filter:blur(120px);opacity:0.12}
.bg-glow::before{width:600px;height:600px;background:var(--purple);top:-200px;right:-200px;animation:floatA 20s ease-in-out infinite}
.bg-glow::after{width:500px;height:500px;background:#a78bfa;bottom:-150px;left:-150px;animation:floatB 25s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-60px,40px) scale(1.08)}66%{transform:translate(30px,-30px) scale(0.94)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.1)}}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:40px 20px 60px}
.hero{text-align:center;margin-bottom:36px;animation:fadeUp 0.5s ease}
.hero-icon{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--purple-soft),rgba(167,139,250,0.12));border:1px solid rgba(99,102,241,0.2);margin-bottom:16px;font-size:26px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#e8e8f0,#c4b5fd,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.hero p{font-size:14px;color:var(--text-dim);max-width:420px;margin:0 auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:12px}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:14px;font-weight:600}
.format-tabs{display:flex;gap:4px;background:var(--surface);border-radius:var(--radius-sm);padding:3px;width:fit-content}
.format-tab{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:all var(--transition);color:var(--text-dim);border:none;background:none;font-family:inherit}
.format-tab.active{background:var(--purple);color:#fff}
.hint-text{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}

.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:36px 20px;text-align:center;cursor:pointer;transition:all var(--transition);position:relative}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--purple);background:var(--purple-soft)}
.upload-zone .upload-icon{font-size:36px;margin-bottom:10px;opacity:0.5;transition:opacity var(--transition)}
.upload-zone:hover .upload-icon,.upload-zone.dragover .upload-icon{opacity:0.8}
.upload-zone .upload-text{font-size:14px;color:var(--text-dim)}
.upload-zone .upload-hint{font-size:11px;color:var(--muted);margin-top:6px}
.upload-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}

.file-list{display:none;max-height:200px;overflow-y:auto;margin-top:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.file-list.show{display:block}
.file-list::-webkit-scrollbar{width:4px}.file-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xs);margin-bottom:4px;font-size:13px}
.file-item .fi-icon{flex-shrink:0;font-size:16px}
.file-item .fi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file-item .fi-meta{font-size:11px;color:var(--text-dim);flex-shrink:0}
.file-item .fi-remove{cursor:pointer;color:var(--muted);padding:2px 6px;font-size:14px;flex-shrink:0;transition:all var(--transition)}
.file-item .fi-remove:hover{color:var(--red)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 22px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition);font-family:inherit;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff;box-shadow:0 2px 12px var(--purple-glow)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 24px rgba(99,102,241,0.35)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-hover);background:var(--surface)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.btn-danger:hover{background:rgba(239,68,68,0.1)}
.btn-sm{padding:5px 12px;font-size:11px}

/* Tasks Panel */
.tasks-panel{margin-top:16px}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px;animation:fadeUp 0.3s ease}
.task-card .tc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.task-card .tc-name{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px}
.task-card .tc-status{font-size:11px;padding:3px 8px;border-radius:10px;flex-shrink:0}
.task-card .tc-status.running{background:rgba(99,102,241,0.15);color:var(--purple-hover)}
.task-card .tc-status.done{background:rgba(34,197,94,0.12);color:var(--green)}
.task-card .tc-status.error{background:rgba(239,68,68,0.12);color:var(--red)}
.task-card .tc-progress{height:4px;background:var(--surface);border-radius:2px;margin-bottom:8px;overflow:hidden}
.task-card .tc-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--purple),#a78bfa);transition:width 0.4s ease}
.task-card .tc-info{font-size:11px;color:var(--text-dim);margin-bottom:8px;display:flex;justify-content:space-between}
.task-card .tc-log{max-height:0;overflow:hidden;transition:max-height 0.3s;font-family:"SF Mono","Consolas",monospace;font-size:11px;line-height:1.7;color:var(--text-dim);background:#0a0a12;border-radius:var(--radius-xs);padding:0 12px;margin-top:0}
.task-card .tc-log.open{max-height:260px;overflow-y:auto;padding:10px 12px;margin-top:8px}
.task-card .tc-log::-webkit-scrollbar{width:4px}.task-card .tc-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.task-card .tc-log .log-line{padding:1px 0}
.task-card .tc-log .log-line.error{color:var(--red)}.task-card .tc-log .log-line.success{color:var(--green)}
.task-card .tc-actions{display:flex;gap:6px;flex-wrap:wrap}
.task-card .tc-actions .tc-btn{padding:4px 10px;font-size:11px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--bg);color:var(--text-dim);cursor:pointer;font-family:inherit;transition:all var(--transition)}
.task-card .tc-actions .tc-btn:hover{border-color:var(--purple);color:var(--purple-hover)}

.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;animation:slideIn 0.3s ease;max-width:360px;backdrop-filter:blur(12px);box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.toast.error{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.toast.success{background:rgba(34,197,94,0.12);color:#86efac;border:1px solid rgba(34,197,94,0.25)}
.toast.info{background:rgba(6,182,212,0.12);color:#67e8f9;border:1px solid rgba(6,182,212,0.25)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* History */
.history-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;opacity:0;pointer-events:none;transition:opacity 0.25s}
.history-overlay.open{opacity:1;pointer-events:auto}
.history-sidebar{position:fixed;top:0;left:-480px;width:440px;height:100vh;background:var(--surface);border-right:1px solid var(--border);z-index:100;transition:left 0.3s;display:flex;flex-direction:column;overflow:hidden}
.history-sidebar.open{left:0}
.history-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.history-header h2{font-size:16px;font-weight:700}
.history-header-actions{display:flex;gap:4px}
.history-collapse,.history-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:var(--radius-xs)}
.history-collapse:hover,.history-close:hover{color:var(--text);background:var(--card)}
.history-list{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.history-list::-webkit-scrollbar{width:5px}.history-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.history-item{padding:14px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:10px}
.history-item .hi-name{font-size:14px;font-weight:600;margin-bottom:4px;word-break:break-all}
.history-item .hi-meta{font-size:12px;color:var(--text-dim);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.history-item .hi-actions{display:flex;gap:6px;flex-wrap:wrap}
.history-item .hi-btn{padding:4px 10px;font-size:11px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--bg);color:var(--text-dim);cursor:pointer;font-family:inherit;transition:all var(--transition)}
.history-item .hi-btn:hover{border-color:var(--purple);color:var(--purple-hover)}
.history-item .hi-btn.del:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,0.1)}
.history-empty{text-align:center;padding:40px 20px;color:var(--muted)}
.history-toggle{position:fixed;top:50%;left:0;transform:translateY(-50%);z-index:98;width:30px;height:70px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-left:none;border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:var(--text-dim);cursor:pointer;font-size:13px;writing-mode:vertical-rl;letter-spacing:2px;font-family:inherit;transition:all var(--transition)}
.history-toggle:hover{color:var(--text);background:var(--card);border-color:var(--purple)}
.history-toggle .ht-count{writing-mode:horizontal-tb;font-size:10px;background:var(--purple);color:#fff;border-radius:10px;padding:1px 4px;min-width:14px;text-align:center;display:none}
.history-toggle .ht-count.show{display:inline-block}
.history-toggle.hidden{opacity:0;pointer-events:none;left:-40px}
@media(max-width:640px){.app{padding:24px 12px 40px}.hero h1{font-size:24px}.card{padding:18px}.history-sidebar{width:340px;left:-340px}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* Settings Modal */
.settings-btn{position:fixed;top:16px;right:16px;z-index:50;width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.settings-btn:hover{color:var(--text);border-color:var(--purple);background:var(--card)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:440px;max-width:92vw;max-height:85vh;overflow-y:auto;padding:28px;animation:fadeUp 0.25s ease}
.modal h2{font-size:18px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;margin-top:14px;font-weight:500}
.modal input,.modal select{width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color var(--transition)}
.modal input:focus,.modal select:focus{border-color:var(--purple)}
.modal .modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.modal .api-key-masked{font-size:13px;color:var(--green);padding:9px 0}
.modal .status-msg{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:var(--radius-xs);display:none}
.modal .status-msg.show{display:block}
.modal .status-msg.ok{background:rgba(34,197,94,0.1);color:var(--green)}
.modal .status-msg.err{background:rgba(239,68,68,0.1);color:var(--red)}
/* Connection Bar */
.conn-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:16px;font-size:12px}
.conn-bar .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.conn-bar .dot.online{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.4)}
.conn-bar .dot.offline{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,0.4)}
.conn-bar .dot.checking{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.conn-bar input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:5px 10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;min-width:180px}
.conn-bar input:focus{border-color:var(--purple)}
.conn-bar .conn-status{font-size:11px;color:var(--text-dim);white-space:nowrap}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="app">
  <div class="hero">
    <div class="hero-icon">⚡</div>
    <h1>知识速通</h1>
    <p>上传需求文档，AI 自动生成结构化学习路径</p>
  </div>


  <div class="conn-bar" id="connBar">
    <div class="dot checking" id="connDot"></div>
    <input type="text" id="apiBase" placeholder="http://127.0.0.1:5173" title="后端 API 地址">
    <span class="conn-status" id="connStatus">检测中...</span>
    <button class="btn btn-ghost btn-sm" onclick="checkConnection()" style="flex-shrink:0">🔄 重试</button>
  </div>

  <div class="card">
    <div class="card-header"><span>📁</span> 上传文档</div>
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon" id="uploadIcon">📤</div>
      <div class="upload-text">拖拽文件到此处，或点击选择（支持多选）</div>
      <div class="upload-hint">.docx / .pdf / .md / .txt，最大 20MB</div>
      <input type="file" id="fileInput" accept=".docx,.pdf,.md,.txt" multiple>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

  <div class="card">
    <div class="card-header"><span>⚙️</span> 输出格式</div>
    <div class="format-tabs">
      <button class="format-tab active" data-format="both">📝 Word + Markdown</button>
      <button class="format-tab" data-format="docx">📄 仅 Word</button>
      <button class="format-tab" data-format="md">📋 仅 Markdown</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><span>🎯</span> 生成深度</div>
    <div class="format-tabs">
      <button class="format-tab active" data-depth="deep">📚 深度学习（6-8章研报）</button>
      <button class="format-tab" data-depth="quick">⚡ 快速摘要（3章概览）</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><span>💬</span> 自定义指令 <span style="font-weight:400;font-size:11px;color:var(--muted)">（可选）</span></div>
    <input type="text" id="instructions" placeholder="例：从业务角度分析，关注商业模式而非技术细节…" style="width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color var(--transition)" onfocus="this.style.borderColor='var(--purple)'" onblur="this.style.borderColor='var(--border)'">
  </div>

  <button class="btn btn-primary" id="generateBtn" style="width:100%;padding:14px;font-size:15px;" disabled onclick="startTasks()">
    <span id="generateBtnIcon">🚀</span> <span id="generateBtnText">上传文档后开始生成</span>
  </button>
  <div class="hint-text">Ctrl + Enter 快捷生成</div>

  <div class="tasks-panel" id="tasksPanel"></div>
</div>

<div class="history-overlay" id="historyOverlay" onclick="closeHistory()"></div>
<div class="history-sidebar" id="historySidebar">
  <div class="history-header">
    <h2>📋 历史记录</h2>
    <div class="history-header-actions">
      <button class="history-collapse" onclick="closeHistory()">◀</button>
      <button class="history-close" onclick="closeHistory()">✕</button>
    </div>
  </div>
  <div class="history-list" id="historyList">
    <div class="history-empty"><div>📭</div><div style="margin-top:8px;">暂无历史记录</div></div>
  </div>
</div>
<button class="history-toggle" id="historyToggle" onclick="toggleHistory()">历 史 记 录 <span class="ht-count" id="htCount"></span></button>
<button class="settings-btn" onclick="openSettings()" title="设置">⚙</button>

<div class="modal-overlay" id="settingsOverlay" onclick="closeSettings(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>⚙️ API 设置</h2>
    <div class="api-key-masked" id="keyStatus" style="display:none"></div>
    <label>API Key</label>
    <input type="password" id="cfgApiKey" placeholder="sk-...">
    <label>模型</label>
    <select id="cfgModel">
      <option value="deepseek-chat">deepseek-chat (DeepSeek V3)</option>
      <option value="deepseek-reasoner">deepseek-reasoner (DeepSeek R1)</option>
      <option value="gpt-4o">gpt-4o (OpenAI)</option>
      <option value="gpt-4o-mini">gpt-4o-mini (OpenAI)</option>
      <option value="claude-sonnet-4-20250514">claude-sonnet-4 (Anthropic)</option>
    </select>
    <label>API Base URL</label>
    <input type="text" id="cfgBaseUrl" placeholder="https://api.deepseek.com">
    <div class="status-msg" id="cfgStatus"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="saveSettings()">💾 保存</button>
    </div>
  </div>
</div>

<script>
var API_BASE="",uploadedFiles=[],outputFormat="both",activeTaskCount=0,depth="deep";
function api(path){return API_BASE+path}
function getApiBase(){return document.getElementById("apiBase").value.trim()||"http://127.0.0.1:5173"}

async function checkConnection(){
  var dot=document.getElementById("connDot"),st=document.getElementById("connStatus");
  dot.className="dot checking";st.textContent="检测中...";
  try{
    var r=await fetch(getApiBase()+"/api/history",{method:"GET",signal:AbortSignal.timeout(5000)});
    if(r.ok){dot.className="dot online";st.textContent="✅ 已连接";localStorage.setItem("ke_api_base",getApiBase());return true}
  }catch(e){}
  dot.className="dot offline";st.textContent="❌ 无法连接";return false
}

(function initApi(){
  var saved=localStorage.getItem("ke_api_base");
  var inp=document.getElementById("apiBase");
  inp.value=saved||"http://127.0.0.1:5173";
  API_BASE=inp.value;
  inp.addEventListener("change",function(){API_BASE=inp.value;checkConnection()});
  checkConnection();
})();
var icons={docx:"📘",pdf:"📕",md:"📝",txt:"📋"};

document.addEventListener("DOMContentLoaded",function(){
  var z=document.getElementById("uploadZone");
  z.addEventListener("dragover",function(e){e.preventDefault();z.classList.add("dragover")});
  z.addEventListener("dragleave",function(){z.classList.remove("dragover")});
  z.addEventListener("drop",function(e){e.preventDefault();z.classList.remove("dragover");if(e.dataTransfer.files.length)handleFiles(e.dataTransfer.files)});
  document.getElementById("fileInput").addEventListener("change",function(e){if(e.target.files.length)handleFiles(e.target.files)});
  document.querySelectorAll(".format-tab").forEach(function(t){t.addEventListener("click",function(){var parent=t.parentElement;parent.querySelectorAll(".format-tab").forEach(function(x){x.classList.remove("active")});t.classList.add("active");if(t.dataset.format)outputFormat=t.dataset.format;if(t.dataset.depth)depth=t.dataset.depth})});
  // Paste support
  document.addEventListener("paste",function(e){var text=(e.clipboardData||window.clipboardData).getData("text");if(text&&text.trim().length>50&&!document.activeElement.closest("input,textarea,[contenteditable]")){e.preventDefault();var title=prompt("文档标题（可选）：",text.trim().slice(0,40).replace(/\\n/g," "));if(title!==null)handlePaste(text,title)}});
  document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();if(!document.getElementById("generateBtn").disabled)startTasks()}});
  fetch(api("/api/history").then(function(r){return r.json()}).then(function(items){if(items&&items.length){var ce=document.getElementById("htCount");ce.textContent=items.length;ce.classList.add("show")}}).catch(function(){});
  // Upload hint includes paste
  document.querySelector(".upload-hint").textContent=".docx / .pdf / .md / .txt，最大 20MB | 也支持 Ctrl+V 粘贴文本";
});

function renderFileList(){
  var list=document.getElementById("fileList"),btn=document.getElementById("generateBtn");
  if(!uploadedFiles.length){list.classList.remove("show");list.innerHTML="";document.getElementById("uploadIcon").textContent="📤";
    if(!activeTaskCount){btn.disabled=true;btn.classList.remove("ready");document.getElementById("generateBtnText").textContent="上传文档后开始生成"}
    return}
  list.classList.add("show");list.innerHTML="";
  var n=uploadedFiles.length;btn.disabled=false;btn.classList.add("ready");
  document.getElementById("generateBtnText").textContent="🚀 生成"+(n>1?" ("+n+" 个)":"");
  document.getElementById("uploadIcon").textContent="✅";
  for(var i=0;i<uploadedFiles.length;i++){(function(f,idx){
    var ext=f.filename.split(".").pop().toLowerCase();
    var div=document.createElement("div");div.className="file-item";
    var preview=f.preview||"";
    if(preview.length>80)preview=preview.slice(0,80)+"...";
    div.innerHTML='<span class="fi-icon">'+(icons[ext]||"📄")+'</span><span class="fi-name" title="'+escHtml(preview)+'">'+escHtml(f.filename)+'</span><span class="fi-meta">'+formatSize(f.size)+'</span><span class="fi-remove">✕</span>';
    div.querySelector(".fi-remove").onclick=function(){uploadedFiles.splice(idx,1);renderFileList()};
    list.appendChild(div);
  })(uploadedFiles[i],i)}
}
async function handleFiles(files){
  for(var i=0;i<files.length;i++){
    var file=files[i],ext=file.name.split(".").pop().toLowerCase();
    if(!["docx","pdf","md","txt"].includes(ext)){toast(file.name+": 不支持 ."+ext,"error");continue}
    if(file.size>20*1024*1024){toast(file.name+": 超过20MB","error");continue}
    var form=new FormData();form.append("file",file);
    try{var res=await fetch(api("/api/upload",{method:"POST",body:form}),data=await res.json();if(data.error){toast(data.error,"error");continue}uploadedFiles.push(data)}catch(e){toast(file.name+": 上传失败","error")}
  }
  renderFileList();
  document.getElementById("generateBtnIcon").textContent="🚀";
}
function startTasks(){
  if(!uploadedFiles.length){toast("请先上传文档","error");return}
  var files=uploadedFiles.slice();uploadedFiles=[];renderFileList();
  for(var i=0;i<files.length;i++){spawnTask(files[i])}
  // Keep generate button enabled so user can add more tasks
  var b=document.getElementById("generateBtn");
  b.disabled=false;b.classList.add("ready");
}
function spawnTask(f){
  var taskId="t_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
  activeTaskCount++;updateRunningCount();
  var card=createTaskCard(taskId,f.filename);
  document.getElementById("tasksPanel").appendChild(card);
  var aborter=new AbortController();
  var logLines=[];
  function addLogLine(msg,type){logLines.push({msg:msg,type:type});updateTaskLog(taskId,logLines)}
  addLogLine("📖 开始处理: "+f.filename,"");
  var instructions=document.getElementById("instructions").value.trim();
  fetch(api("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({file_path:f.path,format:outputFormat,task_id:taskId,depth:depth,instructions:instructions}),signal:aborter.signal}).then(function(res){
    var reader=res.body.getReader(),decoder=new TextDecoder(),buffer="";
    function read(){reader.read().then(function(a){if(a.done){onTaskDone(taskId,f,logLines);return}
      buffer+=decoder.decode(a.value,{stream:true});var lines=buffer.split("\n"),ev="";buffer="";
      for(var i=0;i<lines.length;i++){var l=lines[i];
        if(l.startsWith("event: "))ev=l.slice(7).trim();
        else if(l.startsWith("data: ")){try{var d=JSON.parse(l.slice(6));handleTaskEvent(taskId,ev,d,logLines,aborter)}catch(e){}}
        else if(l.trim())buffer+=l+"\n";
      }read()}).catch(function(){onTaskDone(taskId,f,logLines)})}read();
  }).catch(function(e){if(e.name!=="AbortError")addLogLine("❌ 请求失败: "+e.message,"error");onTaskDone(taskId,f,logLines)});
  return taskId;
}
function createTaskCard(taskId,filename){
  var card=document.createElement("div");card.className="task-card";card.id="card_"+taskId;
  card.innerHTML='<div class="tc-header"><span class="tc-name">📄 '+escHtml(filename)+'</span><span class="tc-status running">⏳ 运行中</span></div>'
    +'<div class="tc-progress"><div class="tc-progress-fill" id="prog_'+taskId+'" style="width:0%"></div></div>'
    +'<div class="tc-info"><span id="step_'+taskId+'">等待开始...</span><span id="eta_'+taskId+'"></span></div>'
    +'<div class="tc-log" id="log_'+taskId+'"></div>'
    +'<div class="tc-actions"><button class="tc-btn" onclick="toggleTaskLog(\''+taskId+'\')">📋 展开日志</button>'
    +'<button class="tc-btn" style="color:var(--red);" onclick="cancelTask(\''+taskId+'\')">✕ 取消</button></div>';
  return card;
}
function handleTaskEvent(taskId,ev,data,logLines,aborter){
  switch(ev){
    case"progress":updateTaskProgress(taskId,data);break;
    case"log":logLines.push({msg:data.msg,type:data.type||""});updateTaskLog(taskId,logLines);break;
    case"done":logLines.push({msg:"✅ 完成！输出: "+data.output_dir,type:"success"});updateTaskLog(taskId,logLines);
      updateTaskStatus(taskId,"done","✅ 已完成",data.output_dir,data.index_path);break;
    case"error":logLines.push({msg:"❌ "+data.message,type:"error"});updateTaskLog(taskId,logLines);
      updateTaskStatus(taskId,"error","❌ 失败");break;
  }
}
function updateTaskProgress(taskId,data){
  var pct=0;
  if(data.step==="1/5")pct=8;else if(data.step==="2/5")pct=20;
  else if(data.step.indexOf("3/5")>=0){var m=data.step.match(/\((\d+)\/(\d+)\)/);if(m)pct=25+Math.round((parseInt(m[1])/parseInt(m[2]))*35);else pct=40}
  else if(data.step==="4/6")pct=55;else if(data.step==="5/6")pct=75;else if(data.step==="6/6")pct=92;else if(data.step==="完成")pct=100;
  var prog=document.getElementById("prog_"+taskId);if(prog)prog.style.width=pct+"%";
  var step=document.getElementById("step_"+taskId);if(step)step.textContent=data.text;
}
function updateTaskLog(taskId,logLines){
  var log=document.getElementById("log_"+taskId);if(!log)return;
  var last=logLines.slice(-8);
  log.innerHTML=last.map(function(l){return'<div class="log-line'+(l.type?" "+l.type:"")+'">'+escHtml(l.msg)+'</div>'}).join("");
}
function toggleTaskLog(taskId){
  var log=document.getElementById("log_"+taskId);if(log)log.classList.toggle("open");
}
function updateTaskStatus(taskId,status,text,outputDir,indexPath){
  var card=document.getElementById("card_"+taskId);if(!card)return;
  var st=card.querySelector(".tc-status");st.className="tc-status "+status;st.textContent=text;
  var actions=card.querySelector(".tc-actions");actions.innerHTML="";
  if(outputDir){
    var dn=outputDir.split(/[\\/]/).pop().replace("知识速通_","");
    (function(d,dn2){var b1=document.createElement("button");b1.className="tc-btn";b1.textContent="📖 打开索引";b1.onclick=function(){window.open(API_BASE+"/output/"+encodeURIComponent(dn2)+"/参考资料索引.html","_blank")};actions.appendChild(b1)})(outputDir,dn);
    (function(d){var b2=document.createElement("button");b2.className="tc-btn";b2.textContent="📂 打开目录";b2.onclick=function(){fetch(api("/api/open?path="+encodeURIComponent(d))};actions.appendChild(b2)})(outputDir);
    (function(d){var b3=document.createElement("button");b3.className="tc-btn";b3.textContent="📦 ZIP";b3.onclick=function(){window.open("/api/download?path="+encodeURIComponent(d),"_blank")};actions.appendChild(b3)})(outputDir);
    (function(tid){var b4=document.createElement("button");b4.className="tc-btn";b4.textContent="📋 查看日志";b4.onclick=function(){toggleTaskLog(tid)};actions.appendChild(b4)})(taskId);
  }
  if(status==="done"||status==="error"){activeTaskCount=Math.max(0,activeTaskCount-1);updateRunningCount();loadHistory()}
}
function cancelTask(taskId){fetch(api("/api/cancel/"+taskId,{method:"POST"}).catch(function(){});activeTaskCount=Math.max(0,activeTaskCount-1);updateRunningCount();updateTaskStatus(taskId,"error","⏹ 已取消")}
function onTaskDone(taskId,f,logLines){if(document.getElementById("card_"+taskId)&&document.querySelector("#card_"+taskId+" .tc-status.running")){updateTaskStatus(taskId,"error","⚠ 中断")}}
function updateRunningCount(){var el=document.getElementById("generateBtnText");if(activeTaskCount>0){el.textContent="🚀 开始生成"+(uploadedFiles.length?" ("+uploadedFiles.length+" 个待处理)":"")}else{renderFileList()}}

function openIndex(){}
function openIndexByDir(dir){if(!dir)return;var n=dir.split(/[\\/]/).pop().replace("知识速通_","");window.open(API_BASE+"/output/"+encodeURIComponent(n)+"/参考资料索引.html","_blank")}
function openFolder(){}
function downloadZip(){}
function resetAll(){uploadedFiles=[];renderFileList();document.getElementById("tasksPanel").innerHTML="";activeTaskCount=0}
function formatSize(b){if(b<1024)return b+" B";if(b<1024*1024)return(b/1024).toFixed(1)+" KB";return(b/1024/1024).toFixed(1)+" MB"}
function toast(msg,type){var el=document.createElement("div");el.className="toast "+(type||"info");el.textContent=msg;document.getElementById("toastContainer").appendChild(el);setTimeout(function(){el.style.opacity="0";el.style.transform="translateX(120%)";el.style.transition="all 0.3s"},2500);setTimeout(function(){el.remove()},2800)}

// History
function toggleHistory(){var s=document.getElementById("historySidebar"),o=document.getElementById("historyOverlay");if(s.classList.contains("open"))closeHistory();else{s.classList.add("open");o.classList.add("open");document.getElementById("historyToggle").classList.add("hidden");loadHistory()}}
function closeHistory(){document.getElementById("historySidebar").classList.remove("open");document.getElementById("historyOverlay").classList.remove("open");document.getElementById("historyToggle").classList.remove("hidden")}
async function loadHistory(){try{var r=await fetch(api("/api/history");renderHistory(await r.json())}catch(e){}}
function renderHistory(items){var c=document.getElementById("historyList"),ce=document.getElementById("htCount");if(!items||!items.length){c.innerHTML='<div class="history-empty"><div>📭</div><div style="margin-top:8px;">暂无历史记录</div></div>';ce.classList.remove("show");return}ce.textContent=items.length;ce.classList.add("show");c.innerHTML="";for(var i=0;i<items.length;i++){(function(it){var div=document.createElement("div");div.className="history-item";div.innerHTML='<div class="hi-name">📄 '+escHtml(it.filename)+'</div><div class="hi-meta"><span>🕐 '+it.date+'</span><span>📖 '+(it.chapter_count||"?")+' 章</span>'+(it.domain?'<span>🏷 '+escHtml(it.domain)+'</span>':'')+(!it.exists?'<span style="color:var(--yellow);">⚠ 目录已删除</span>':'')+'</div><div class="hi-actions"></div>';var actions=div.querySelector(".hi-actions");if(it.exists){(function(dir){var b=document.createElement("button");b.className="hi-btn";b.textContent="📖 打开索引";b.onclick=function(){openIndexByDir(dir)};actions.appendChild(b)})(it.output_dir);(function(dir){var b=document.createElement("button");b.className="hi-btn";b.textContent="📂 打开目录";b.onclick=function(){fetch(api("/api/open?path="+encodeURIComponent(dir))};actions.appendChild(b)})(it.output_dir);(function(dir){var b=document.createElement("button");b.className="hi-btn";b.textContent="📦 ZIP";b.onclick=function(){window.open("/api/download?path="+encodeURIComponent(dir),"_blank")};actions.appendChild(b)})(it.output_dir)}else{(function(id,fp,fmt){var b=document.createElement("button");b.className="hi-btn";b.style.borderColor="var(--purple)";b.style.color="var(--purple-hover)";b.textContent="🔄 重新生成";b.onclick=function(){regenerateFromHistory(id,fp,fmt)};actions.appendChild(b)})(it.id,it.file_path||"",it.output_fmt||"both")}(function(id){var b=document.createElement("button");b.className="hi-btn del";b.textContent="🗑 删除记录";b.onclick=function(){deleteHistoryItem(id)};actions.appendChild(b)})(it.id);c.appendChild(div)})(items[i])}}
async function regenerateFromHistory(id,fp,fmt){if(!fp){toast("文件路径丢失","error");return}try{var res=await fetch(api("/api/upload/check?path="+encodeURIComponent(fp)),data=await res.json();if(!data.exists){toast("文件已移动或删除","error");return}closeHistory();uploadedFiles=[{filename:data.filename,path:fp,size:data.size,full_length:data.full_length}];outputFormat=fmt;renderFileList();var b=document.getElementById("generateBtn");b.disabled=false;b.classList.add("ready");document.getElementById("generateBtnText").textContent="开始生成学习路径";toast("文件已加载，点击生成即可","success")}catch(e){toast("检查失败: "+e.message,"error")}}
async function deleteHistoryItem(id){if(!confirm("确定删除？"))return;try{await fetch(api("/api/history/"+id,{method:"DELETE"});loadHistory()}catch(e){toast("删除失败","error")}}
function escHtml(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
async function handlePaste(text,title){try{var r=await fetch(api("/api/paste",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,title:title})}),data=await r.json();if(data.error){toast(data.error,"error");return}uploadedFiles.push(data);renderFileList();toast("✅ 已粘贴: "+data.filename,"success")}catch(e){toast("粘贴失败","error")}}
// Settings
async function openSettings(){document.getElementById("settingsOverlay").classList.add("open");try{var r=await fetch(api("/api/config"),cfg=await r.json();document.getElementById("cfgModel").value=cfg.model||"deepseek-chat";document.getElementById("cfgBaseUrl").value=cfg.base_url||"https://api.deepseek.com";if(cfg.api_key_masked){var ks=document.getElementById("keyStatus");ks.textContent="✅ 已配置: "+cfg.api_key_masked;ks.style.display="block";document.getElementById("cfgApiKey").placeholder="留空保持不变"}}catch(e){}}
function closeSettings(e){if(e&&e.target!==document.getElementById("settingsOverlay"))return;document.getElementById("settingsOverlay").classList.remove("open")}
async function saveSettings(){var key=document.getElementById("cfgApiKey").value.trim(),model=document.getElementById("cfgModel").value,base=document.getElementById("cfgBaseUrl").value.trim(),st=document.getElementById("cfgStatus");st.className="status-msg";st.style.display="none";var body={model:model,base_url:base};if(key)body.api_key=key;try{var r=await fetch(api("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r.ok){st.textContent="✅ 保存成功！重启服务后生效";st.className="status-msg ok show";setTimeout(closeSettings,1500)}else{var e=await r.json();st.textContent="❌ "+ (e.error||"保存失败");st.className="status-msg err show"}}catch(err){st.textContent="❌ 网络错误";st.className="status-msg err show"}}
</script>
